name: Release
run-name: Release ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or recover (for example v0.6.0)
        required: true
        type: string

# A tag push and publishing through the UI can both start this workflow.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      existing_artifact: ${{ steps.reuse.outputs.reused == 'true' && format('research-runner-existing-{0}', steps.source.outputs.commit) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the release tag and identify its source
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          python tools/prepare_release.py --source source --tag "$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reuse a complete release bundle for duplicate events and retries
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python tools/publish_release.py --download-existing --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --dist dist
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.reused == 'true'
        with:
          name: research-runner-existing-${{ steps.source.outputs.commit }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  validate:
    needs: source
    uses: ./.github/workflows/test.yml
    with:
      source_ref: ${{ needs.source.outputs.commit }}
      release_tag: ${{ needs.source.outputs.tag }}
      existing_artifact: ${{ needs.source.outputs.existing_artifact }}

  publish:
    needs: [source, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Use the workflow's tooling even when recovering a tag predating it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: dist
      - name: Upload and verify the tested assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python tools/publish_release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --dist dist
