name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact commit to build and test
        type: string
        required: true
      existing_artifact:
        description: Complete release bundle to retest instead of rebuilding published files
        type: string
        default: ''
    outputs:
      artifact_name:
        description: Bundle built once and used by all tests
        value: ${{ jobs.distribution.outputs.artifact_name }}
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Identify the checked out source
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "artifact_name=research-runner-$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Check committed source for machine-specific configuration
        run: python tools/check_portability.py --revision HEAD
      - name: Build sdist and wheel from sdist
        if: inputs.existing_artifact == ''
        run: python -m build
      - uses: actions/download-artifact@v5
        if: inputs.existing_artifact != ''
        with:
          name: ${{ inputs.existing_artifact }}
          path: dist
      - name: Package docs and checksums from the wheel
        run: python tools/package_distribution.py --dist dist
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
          overwrite: true
  fixtures:
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.distribution.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.distribution.outputs.artifact_name }}
          path: dist
      - run: python -m pip install -e '.[server,test]'
      - name: Install a separate producer without server dependencies
        run: |
          python -m venv "$RUNNER_TEMP/rr-client"
          "$RUNNER_TEMP/rr-client/bin/python" -m pip install dist/*.whl
          echo "RR_INSTALLED_CLIENT=$RUNNER_TEMP/rr-client/bin/research-runner" >> "$GITHUB_ENV"
      - run: python -m pytest -q
  installed-client:
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.distribution.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.distribution.outputs.artifact_name }}
          path: dist
      - shell: bash
        run: python -m pip install dist/*.whl pytest
      - name: Test the published wheel outside the source checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_producer.py" --import-mode=importlib -q
          python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('fastapi','uvicorn','openai_codex'))"
