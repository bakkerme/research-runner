name: Tests
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - name: Check committed source for machine-specific configuration
        run: python tools/check_portability.py --revision HEAD
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"]=="v"+v, "tag must match package version"'
      - name: Build sdist and wheel from sdist
        run: python -m build
      - name: Package docs and checksums from the wheel
        run: python tools/package_distribution.py --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: research-runner-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
  fixtures:
    needs: distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v5
        with:
          name: research-runner-${{ github.sha }}
          path: dist
      - run: python -m pip install -e '.[server,test]'
      - name: Install a separate producer without server dependencies
        run: |
          python -m venv "$RUNNER_TEMP/rr-client"
          "$RUNNER_TEMP/rr-client/bin/python" -m pip install dist/*.whl
          echo "RR_INSTALLED_CLIENT=$RUNNER_TEMP/rr-client/bin/research-runner" >> "$GITHUB_ENV"
      - run: python -m pytest -q
  installed-client:
    needs: distribution
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: research-runner-${{ github.sha }}
          path: dist
      - shell: bash
        run: python -m pip install dist/*.whl pytest
      - name: Test the published wheel outside the source checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_producer.py" --import-mode=importlib -q
          python -c "import importlib.util; assert all(importlib.util.find_spec(m) is None for m in ('fastapi','uvicorn','openai_codex'))"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [distribution, fixtures, installed-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: research-runner-${{ github.sha }}
          path: dist
      - name: Publish tested assets without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Research Runner $RELEASE_TAG" --generate-notes
